<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <script>
    try { document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem("color-scheme") ?? "light dark"; } catch (e) {}
  </script>
  <title>Reviewer console — Gatecast</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111418'/%3E%3Cpath d='M9 25V14a7 7 0 0 1 14 0v11M16 18v7' stroke='%23fff' stroke-width='2.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/review.css">
  <script type="module" src="js/review.js"></script>
</head>
<body class="page-review">
  <a class="skip-link" href="#main">Skip to content</a>

  <main id="main" class="rv">
    <!-- Signed out, link sent, not a reviewer: one centred card. -->
    <section class="rv-gate" id="gate" aria-labelledby="gate-title">
      <div class="rv-gate__card">
        <a class="brand rv-gate__brand" href="./" aria-label="Gatecast home">
          <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><g transform="translate(4 5)"><path d="M5 20V9a7 7 0 0 1 14 0v11"/><path d="M12 13v7"/></g></svg>
          <span class="brand__name">Gatecast</span>
        </a>
        <h1 class="rv-gate__title signage" id="gate-title">Reviewer console</h1>
        <div id="gate-body">
          <p class="rv-gate__lede">For the people who check and publish “Both sides” topics. Visitors never see this page.</p>
          <noscript><p class="rv-alert">The reviewer console needs JavaScript.</p></noscript>
        </div>
      </div>
    </section>

    <!-- Signed in as a reviewer. -->
    <div class="rv-app" id="app" hidden>
      <nav class="rv-side" aria-label="Views">
        <a class="brand rv-side__brand" href="./" aria-label="Gatecast home">
          <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><g transform="translate(4 5)"><path d="M5 20V9a7 7 0 0 1 14 0v11"/><path d="M12 13v7"/></g></svg>
          <span class="brand__name">Gatecast</span>
        </a>
        <h1 class="rv-side__title signage">Reviewer console</h1>
        <div id="nav"></div>
      </nav>

      <div class="rv-main">
        <div class="rv-top">
          <label class="sr-only" for="search">Search this view</label>
          <input id="search" class="rv-search" type="search" placeholder="Search title, speaker or place" autocomplete="off" spellcheck="false">
          <span class="rv-top__who" id="who"></span>
          <button type="button" class="btn btn--ghost" id="signout">Sign out</button>
        </div>

        <div class="rv-panes" id="panes" data-pane="list">
          <section class="rv-list" id="list-pane" aria-labelledby="list-title"></section>
          <section class="rv-detail" id="detail" aria-label="Details"></section>
        </div>
      </div>
    </div>
  </main>

  <div class="rv-toasts" id="toasts" role="status" aria-live="polite"></div>
  <dialog class="rv-dialog" id="dialog" aria-labelledby="dialog-title"></dialog>
</body>
</html>
