<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <script>
    try { document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem("color-scheme") ?? "light dark"; } catch (e) {}
  </script>
  <title>Reviewer console — Gatecast</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="styles/site.css">
  <link rel="stylesheet" href="styles/console.css">
  <script type="module" src="js/review.js"></script>
</head>
<body class="min-h-dvh">
  <a class="skip-link" href="#main">Skip to content</a>

  <main id="main" class="rv w-full">
    <!-- Signed out, link sent, not a reviewer: one centred card. -->
    <section class="rv-gate grid min-h-dvh place-items-center px-4 py-6" id="gate" aria-labelledby="gate-title">
      <div class="grid w-full max-w-120 gap-4 rounded-xl border border-line bg-np-card px-4 py-6 shadow-np md:px-6 md:py-8">
        <a class="brand justify-self-start" href="./" aria-label="Gatecast home">
          <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><g transform="translate(4 5)"><path d="M5 20V9a7 7 0 0 1 14 0v11"/><path d="M12 13v7"/></g></svg>
          <span class="brand__name">Gatecast</span>
        </a>
        <h1 class="signage text-title/none" id="gate-title">Reviewer console</h1>
        <div id="gate-body" class="grid gap-4">
          <p class="rv-gate__lede">For the people who check and publish “Both sides” topics. Visitors never see this page.</p>
          <noscript><p class="rv-alert">The reviewer console needs JavaScript.</p></noscript>
        </div>
      </div>
    </section>

    <!-- Signed in as a reviewer. -->
    <div class="grid h-dvh grid-cols-[minmax(0,1fr)] grid-rows-[auto_minmax(0,1fr)] md:h-auto md:min-h-dvh md:grid-cols-[--spacing(60)_minmax(0,1fr)] md:grid-rows-none" id="app" hidden>
      <nav class="flex items-center gap-2 overflow-x-auto overscroll-x-contain border-b border-line bg-np-card px-3 py-2 md:sticky md:top-0 md:grid md:h-dvh md:content-start md:overflow-auto md:border-r md:border-b-0 md:px-3 md:py-4" aria-label="Views">
        <a class="brand flex-none md:px-2 max-md:[&_.brand\_\_name]:hidden" href="./" aria-label="Gatecast home">
          <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><g transform="translate(4 5)"><path d="M5 20V9a7 7 0 0 1 14 0v11"/><path d="M12 13v7"/></g></svg>
          <span class="brand__name">Gatecast</span>
        </a>
        <h1 class="signage px-2 pb-2 text-xl/tight text-np-muted max-md:hidden">Reviewer console</h1>
        <div id="nav" class="max-md:flex max-md:gap-1"></div>
      </nav>

      <div class="grid min-h-0 min-w-0 grid-rows-[auto_minmax(0,1fr)] overflow-hidden md:h-dvh md:overflow-visible">
        <div class="flex items-center gap-2 border-b border-line bg-np-paper px-3 py-2 md:gap-3 md:px-4 md:py-3">
          <label class="sr-only" for="search">Search this view</label>
          <input id="search" class="flex-1 md:max-w-128" type="search" placeholder="Search title, speaker or place" autocomplete="off" spellcheck="false">
          <span class="ml-auto min-w-0 truncate text-sm text-np-muted max-md:hidden" id="who"></span>
          <button type="button" class="btn btn--ghost" id="signout">Sign out</button>
        </div>

        <div class="rv-panes grid min-h-0 grid-cols-[minmax(0,1fr)] grid-rows-[minmax(0,1fr)] lg:grid-cols-[minmax(--spacing(72),--spacing(96))_minmax(0,1fr)]" id="panes" data-pane="list">
          <section class="rv-list relative min-h-0 overflow-auto bg-np-card lg:border-r lg:border-line" id="list-pane" aria-labelledby="list-title"></section>
          <section class="rv-detail relative min-h-0 overflow-auto bg-np-paper" id="detail" aria-label="Details"></section>
        </div>
      </div>
    </div>
  </main>

  <div class="fixed top-18 right-4 z-20 grid w-[min(100%-2*var(--spacing)*4,--spacing(104))] gap-2" id="toasts" role="status" aria-live="polite"></div>
  <dialog class="rv-dialog" id="dialog" aria-labelledby="dialog-title"></dialog>
</body>
</html>
